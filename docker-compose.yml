services:
  web:
    build: .
    env_file: .env
    environment:
      TICKWELL_DATABASE_URL: sqlite:////app/state/tickwell.db
      TICKWELL_EXPORT_DIR: /app/state/exports
    volumes:
      - ./state:/app/state
    ports:
      - "8000:8000"
  worker:
    build: .
    env_file: .env
    environment:
      TICKWELL_DATABASE_URL: sqlite:////app/state/tickwell.db
      TICKWELL_EXPORT_DIR: /app/state/exports
    volumes:
      - ./state:/app/state
    command: ["tickwell", "worker"]
    depends_on:
      - web
