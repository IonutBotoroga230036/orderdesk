# Fully local setup: OrderDesk plus an Ollama model server on the same machine.
# No order data leaves this machine.
#
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build
#   docker compose exec ollama ollama pull <model>     # once, then set ORDERDESK_OLLAMA_MODEL in .env
#
# GPU: on a machine with an NVIDIA GPU and the NVIDIA Container Toolkit, uncomment the
# "deploy" block below. Without it the model runs on the CPU, which works but is slower.

services:
  ollama:
    image: ollama/ollama
    volumes:
      - ./state/ollama:/root/.ollama
    restart: unless-stopped
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  web:
    environment:
      ORDERDESK_EXTRACTOR: local
      ORDERDESK_LOCAL_ONLY: "true"
      ORDERDESK_OLLAMA_BASE_URL: http://ollama:11434
    depends_on:
      - ollama

  worker:
    environment:
      ORDERDESK_EXTRACTOR: local
      ORDERDESK_LOCAL_ONLY: "true"
      ORDERDESK_OLLAMA_BASE_URL: http://ollama:11434
    depends_on:
      - ollama
