<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tickwell</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<header class="top">
  <div class="brand"><svg class="logo" viewBox="0 0 120 120" aria-hidden="true"><defs><mask id="tw-gap" maskUnits="userSpaceOnUse" x="0" y="0" width="120" height="120"><rect width="120" height="120" fill="#fff"/><path d="M29 79 H38 L48 88 L104 20" fill="none" stroke="#000" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/></mask></defs><g mask="url(#tw-gap)"><rect class="logo-env" x="16" y="34" width="84" height="62" rx="10"/><path class="logo-lines" d="M29 51 H66 M29 65 H54"/></g><path class="logo-tick" d="M29 79 H38 L48 88 L104 20"/></svg><div><strong>Tickwell</strong><span>Order emails to draft orders</span></div></div>
  <div class="stats" id="stats"></div>
  <button class="ghost" id="fetch">Fetch new mail</button>
</header>
<main class="layout">
  <aside class="inbox"><ul id="list"></ul></aside>
  <article class="paper" id="email"><p class="muted">Select an email.</p></article>
  <section class="panel" id="draft" aria-label="Draft order"></section>
</main>
<div id="toast" role="status" aria-live="polite"></div>
<script src="/static/app.js"></script>
</body>
</html>
