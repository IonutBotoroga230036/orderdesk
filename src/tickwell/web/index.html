<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tickwell</title>
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<header class="top">
  <div class="brand"><span class="logo" aria-hidden="true"></span><div><strong>Tickwell</strong><span>Order emails to draft orders</span></div></div>
  <div class="stats" id="stats"></div>
  <button class="ghost" id="fetch">Fetch new mail</button>
</header>
<main class="layout">
  <aside class="inbox"><ul id="list"></ul></aside>
  <article class="paper" id="email"><p class="muted">Select an email.</p></article>
  <section class="panel" id="draft" aria-label="Draft order"></section>
</main>
<div id="toast" role="status" aria-live="polite"></div>
<script src="/static/app.js"></script>
</body>
</html>
